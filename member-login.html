<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BM61CQBRB9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BM61CQBRB9');
    </script>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Member Login | Next Level Recreation Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                "colors": {
                        "primary": "#002046",
                        "secondary": "#b51a1e",
                        "surface": "#f8f9fa"
                },
                "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Public Sans"]
                }
              },
            },
          }
    </script>
</head>
<body class="bg-surface font-body text-[#191c1d] min-h-screen flex items-center justify-center p-6 bg-[url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center">
    <div class="absolute inset-0 bg-primary/80 backdrop-blur-sm"></div>

    <div class="w-full max-w-md z-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-white font-headline tracking-tighter mb-2">Member Hub</h1>
            <p class="text-slate-300">Access your NLRC portal</p>
        </div>

        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-primary">Welcome Back</h2>
                <p class="text-slate-500 text-sm">Sign in to manage your memberships</p>
            </div>

            <form id="member-login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-primary mb-2" for="email">Email Address</label>
                    <input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:ring-primary focus:border-primary transition-all" id="email" type="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-primary mb-2" for="password">Password</label>
                    <input class="w-full px-4 py-3 rounded-xl border-slate-200 focus:ring-primary focus:border-primary transition-all" id="password" type="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-bold hover:bg-secondary transition-all shadow-lg">Sign In</button>
                
                <div class="relative flex items-center py-4">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="px-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Or</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>

                <button type="button" onclick="signInWithGoogle().then(u => {if(u) window.location.href='member-portal.html'})" class="w-full bg-white border border-slate-200 text-primary py-4 rounded-xl font-bold hover:bg-slate-50 transition-all flex items-center justify-center gap-3">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5 h-5" alt="Google">
                    Continue with Google
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-slate-500">
                Don't have an account? <a href="#" onclick="toggleSignUp()" class="text-secondary font-bold hover:underline">Join Now</a>
            </p>
        </div>

        <!-- Sign Up Modal (Simple toggle for now) -->
        <div id="signup-form" class="hidden mt-6 bg-white rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-primary mb-2">Create Account</h2>
            <p class="text-slate-500 text-sm mb-6">Join the community today</p>
            <form id="member-signup-form" class="space-y-4">
                <input class="w-full px-4 py-3 rounded-xl border-slate-200" id="reg-name" type="text" placeholder="Full Name" required>
                <input class="w-full px-4 py-3 rounded-xl border-slate-200" id="reg-email" type="email" placeholder="Email Address" required>
                <input class="w-full px-4 py-3 rounded-xl border-slate-200" id="reg-password" type="password" placeholder="Create Password" required>
                <button type="submit" class="w-full bg-secondary text-white py-4 rounded-xl font-bold shadow-lg">Register</button>
            </form>
            <button onclick="toggleSignUp()" class="w-full mt-4 text-slate-400 text-sm font-medium hover:text-primary">Back to Login</button>
        </div>
    </div>

    <script type="module" src="js/auth-handler.js"></script>
    <script>
        function toggleSignUp() {
            document.getElementById('signup-form').classList.toggle('hidden');
            document.getElementById('member-login-form').parentElement.classList.toggle('hidden');
        }

        document.getElementById('member-login-form').onsubmit = (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            window.signInMember(email, password);
        };

        document.getElementById('member-signup-form').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            window.signUpMember(email, password, name);
        };
    </script>
</body>
</html>
